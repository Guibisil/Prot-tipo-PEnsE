{% extends "base.html" %}

{% block titulo %}Submeter Projeto{% endblock %}

<!--main-->
{% block conteudo %}
    
    <section class="container p-4">

        <article class="row px-4 pb-2" style="border-bottom: 1px solid rgb(102, 102, 192);">
            <div class="col-6"><p class="m-0 h2 pt-1" style="color:rgb(102, 102, 192)">Submeter Projeto:</p></div>
        </article>

        <article class="container p-4">
            <form>

                <div class="py-3">
                    <!--autor-->
                    <div class="my-2">
                        <label for="autor" class="form-label m-0">Autor:</label>
                        <input class="form-control" placeholder="Nome do autor..." name="autor" id="autor">
                    </div>
                    
                    <!--campus+modalidade-->
                    <div class="row mb-2">
                        <div class="col-8">
                            <label for="campus" class="form-label m-0">Campus:</label>
                            <input class="form-control" placeholder="Campus ..." name="campus" id="campus">
                        </div>
                        <div class="col-4">
                            <label for="modalidade" class="form-label m-0">Modalidade:</label>
                            <select class="form-select" name="modalidade" id="modalidade">
                                <option value="" selected disabled>Selecione</option>
                                <option value="Ensino">Ensino</option>
                                <option value="Pesquisa">Pesquisa</option>
                                <option value="Extensão">Extensão</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <hr>

                <div class="py-3">
                    <!--titulo-->
                    <div class="mb-2">
                        <label for="titulo" class="form-label m-0">Título:</label>
                        <input class="form-control" placeholder="Título..." name="titulo" id="titulo">
                    </div>

                    <!--resumo-->
                    <div class="mb-2">
                        <label for="resumo" class="form-label m-0">Resumo:</label>
                        <textarea rows="5" class="form-control" placeholder="Resumo do projeto..." name="resumo" id="resumo"></textarea>
                    </div>

                    <!--botao-->
                    <div class="text-end py-2">
                        <button class="btn btn-primary" id="botao_submeter">Submeter</button>
                    </div>
                </div>
                
            </form>

        </article>

        <!--validade form-->
        <article class="container px-4">
            <div class="container rounded-3 text-start p-2 px-4" id="aviso_bg">
                <span id="aviso"></span>
            </div>
        </article>

    </section>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

{%endblock%}
