<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Meu Site{% endblock %}</title>


    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>

    <!--Static-->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>

<body class="d-flex flex-column min-vh-100">
    <!--cabeçalho-->
    <header class="container-fluid bg-white mt-0 text-center shadow sticky-top">

        <article class="text-center pt-2 pb-1">
            <a href='/' style="text-decoration: none;"><p class="h3" style="color: blue">PEnsE-Submite</p></a>
        </article>

    </header>

    <!--corpo-->
    <main class="flex-grow-1 p-5">
    {% block conteudo %}{% endblock %}
    </main>

    <!--rodapé-->
    <footer class="container-fluid bg-secondary text-white d-flex justify-content-between align-items-center py-3">

        <article class="lh-1">
            <p class="h6 mb-1"><b>Portal Integra</b> © 2020-2026 IFRS</p>
            <p class="mb-0">Desenvolvido pelo IFRS.</p>
        </article>

    </footer>
</body>

</html>
